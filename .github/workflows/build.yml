name: Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore KanbanFlow.sln

      - name: Build
        run: dotnet build KanbanFlow.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test KanbanFlow.sln --no-build --configuration Release --verbosity normal
